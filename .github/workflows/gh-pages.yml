name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies
        run: npm ci --legacy-peer-deps || npm install --legacy-peer-deps

      - name: Build Project
        env:
          NITRO_PRESET: static
        run: npm run build

      - name: Locate Build Artifact and Setup Static Hosting
        id: locate
        run: |
          if [ -d ".output/public" ]; then
            TARGET_DIR=".output/public"
          elif [ -d "dist" ]; then
            TARGET_DIR="dist"
          else
            TARGET_DIR="."
          fi
          echo "path=$TARGET_DIR" >> $GITHUB_OUTPUT

          # Disable Jekyll so underscore-prefixed folders (e.g. _build) are served
          touch "$TARGET_DIR/.nojekyll"

          # Provide 404.html fallback for client-side routing
          if [ -f "$TARGET_DIR/index.html" ]; then
            cp "$TARGET_DIR/index.html" "$TARGET_DIR/404.html"
          fi

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.locate.outputs.path }}

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
